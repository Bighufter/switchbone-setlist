# Houdt het gratis Supabase-project wakker. Supabase pauzeert een gratis project na een week zonder verkeer;
# deze taak vraagt elke drie dagen één keer iets op (band_pull met een code die niet bestaat, dus zonder gegevens).
# De URL en de publieke sleutel staan ook gewoon in index.html; ze geven zonder bandcode geen toegang.
name: Supabase wakker houden
on:
  schedule:
    - cron: "23 7 */3 * *"   # elke drie dagen om 07:23 UTC
  workflow_dispatch: {}        # handmatig starten via Actions > Run workflow
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Supabase aanroepen
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            -X POST "https://gghxaakwzynkmjiymrxm.supabase.co/rest/v1/rpc/band_pull" \
            -H "apikey: sb_publishable_zGcjK0CBOtrw2T-UQkGL0g_hVhT2CpZ" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"WAKKERHOUDEN"}')
          echo "Supabase antwoordde met $code"
          test "$code" = "200"
